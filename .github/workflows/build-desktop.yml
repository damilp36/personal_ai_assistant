name: Build desktop downloads

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: macos
            archive: My-Local-Note-Taker-macOS-Apple-Silicon.zip
            artifact: macos-apple-silicon-download
          - os: macos-15-intel
            platform: macos
            archive: My-Local-Note-Taker-macOS-Intel.zip
            artifact: macos-intel-download
          - os: windows-latest
            platform: windows
            archive: My-Local-Note-Taker-Windows.zip
            artifact: windows-download
    runs-on: ${{ matrix.os }}

    steps:
      - name: Get source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build packages
        run: python -m pip install -r requirements.txt "pyinstaller>=6,<7"

      - name: Build macOS application
        if: matrix.platform == 'macos'
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir \
            --name "My Local Note Taker" \
            --add-data "app.py:." \
            --add-data "assistant:assistant" \
            --add-data ".streamlit/config.toml:.streamlit" \
            --collect-all streamlit \
            --collect-submodules assistant \
            --hidden-import docx \
            --hidden-import openpyxl \
            --hidden-import pypdf \
            --hidden-import requests \
            desktop_launcher.py
          ditto -c -k --sequesterRsrc --keepParent \
            "dist/My Local Note Taker.app" \
            "${{ matrix.archive }}"

      - name: Build Windows application
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir `
            --name "My Local Note Taker" `
            --add-data "app.py;." `
            --add-data "assistant;assistant" `
            --add-data ".streamlit/config.toml;.streamlit" `
            --collect-all streamlit `
            --collect-submodules assistant `
            --hidden-import docx `
            --hidden-import openpyxl `
            --hidden-import pypdf `
            --hidden-import requests `
            desktop_launcher.py
          Compress-Archive `
            -Path "dist\My Local Note Taker" `
            -DestinationPath "${{ matrix.archive }}"

      - name: Upload desktop download
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.archive }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download built applications
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: Add applications to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*.zip
          generate_release_notes: true
